<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>NoCarb-T Reel</title>
  <link rel="stylesheet" href="reel.css" />
</head>
<body>
  <div id="stage">
    <div id="bg"></div>
    <div id="track">
      <!-- 1: Hook -->
      <section class="slide" id="s1">
        <div class="blob" style="left: -420px; top: 900px"></div>
        <div class="ring" style="right: -160px; top: 120px"></div>
        <h1 class="hl" style="top: 230px; font-size: 128px">
          <span data-t="s1_l1"></span>
          <span data-t="s1_l2"></span>
          <span data-t="s1_l3"></span>
        </h1>
        <div class="card" style="top: 760px; width: 560px; height: 720px; margin-left: -280px">
          <img id="s1-video" src="assets/pizza-frames/f_0001.jpg" alt="" style="object-position: 50% 30%" />
        </div>
        <p class="swipe"><span data-t="s1_swipe"></span></p>
        <div class="emoji" id="s1-emoji" style="top: 1300px; left: 640px; right: auto; font-size: 170px">🍕</div>
      </section>

      <!-- 2: Frage -->
      <section class="slide" id="s2">
        <div class="blob" style="right: -500px; top: -300px"></div>
        <div class="ring" style="left: -180px; top: 1180px"></div>
        <h1 class="hl" style="top: 420px; font-size: 250px; line-height: 0.9">
          <span data-t="s2_l1"></span>
          <span data-t="s2_l2"></span>
        </h1>
        <div class="emoji" id="s2-emoji" style="top: 1000px; font-size: 300px">😬</div>
      </section>

      <!-- 3: Alle Inhaltsstoffe auf einer Folie -->
      <section class="slide" id="s3">
        <div class="blob" style="left: -500px; top: -420px"></div>
        <div class="ring" style="right: -200px; top: 1250px"></div>
        <h1 class="hl" style="top: 150px; font-size: 104px">
          <span data-t="s3_title"></span>
        </h1>
        <div class="card" style="top: 330px; width: 840px; height: 400px; margin-left: -420px">
          <img id="s3-video" src="assets/zutaten-frames/f_0001.jpg" alt="" style="object-position: 50% 45%" />
        </div>
        <div class="groups" style="top: 790px">
          <div class="group">
            <p class="g-head"><i class="wa big"></i><span data-t="g1_head"></span></p>
            <p class="g-names" data-t="g1_names"></p>
            <p class="p-row"><i class="wa"></i><span data-t="g1_row"></span></p>
          </div>
          <div class="group">
            <p class="g-head"><i class="wa big"></i><span data-t="g2_head"></span></p>
            <p class="p-row"><i class="wa"></i><span data-t="g2_row"></span></p>
          </div>
          <div class="group">
            <p class="g-head"><i class="wa big"></i><span data-t="g3_head"></span></p>
            <p class="p-row"><i class="wa"></i><span data-t="g3_row"></span></p>
          </div>
        </div>
      </section>

      <!-- 3w: Wirkung (Bild) -->
      <section class="slide" id="s3w">
        <div class="blob" style="right: -480px; top: -380px"></div>
        <div class="ring" style="left: -190px; top: 1240px"></div>
        <h1 class="hl" style="top: 190px; font-size: 120px">
          <span data-t="s3w_l1"></span>
          <span data-t="s3w_l2"></span>
        </h1>
        <div class="card" style="top: 500px; width: 900px; height: 470px; margin-left: -450px">
          <img src="assets/wirkung.jpg" alt="" style="object-position: 60% 50%" />
          <i class="spark" style="left: 350px; top: 187px"></i><i class="spark" style="left: 316px; top: 294px"></i><i class="spark" style="left: 391px; top: 232px"></i><i class="spark" style="left: 329px; top: 133px"></i><i class="spark" style="left: 307px; top: 115px"></i><i class="spark" style="left: 392px; top: 250px"></i><i class="spark" style="left: 364px; top: 314px"></i><i class="spark" style="left: 485px; top: 125px"></i><i class="spark" style="left: 346px; top: 243px"></i><i class="spark" style="left: 427px; top: 202px"></i><i class="spark" style="left: 360px; top: 309px"></i><i class="spark" style="left: 334px; top: 321px"></i>
        </div>
        <div class="chips small" style="top: 1040px; flex-direction: column; align-items: center; gap: 22px">
          <span class="chip"><span data-t="s3w_c1"></span></span>
          <span class="chip"><span data-t="s3w_c2"></span></span>
          <span class="chip"><span data-t="s3w_c3"></span></span>
        </div>
      </section>

      <!-- 4: Ohne -->
      <section class="slide" id="s4">
        <div class="blob" style="left: -400px; top: 1000px"></div>
        <div class="ring" style="right: -150px; top: 160px"></div>
        <h1 class="hl" style="top: 600px; font-size: 92px; line-height: 1.9; text-align: left; left: 70px; right: 40px">
          <span><span class="check"><svg viewBox="0 0 24 24" width="64" height="64"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span data-t="s4_l1"></span></span>
          <span><span class="check"><svg viewBox="0 0 24 24" width="64" height="64"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span data-t="s4_l2"></span></span>
        </h1>
      </section>

      <!-- 5: Ritual -->
      <section class="slide" id="s5">
        <div class="blob" style="right: -520px; top: 980px"></div>
        <div class="ring" style="left: -170px; top: 140px"></div>
        <h1 class="hl" style="top: 180px; font-size: 118px">
          <span data-t="s5_l1"></span>
          <span data-t="s5_l2"></span>
          <span data-t="s5_l3"></span>
        </h1>
        <div class="card" style="top: 590px; width: 600px; height: 800px; margin-left: -300px">
          <img src="assets/frau3.jpg" alt="" style="object-position: 50% 29%" />
        </div>
        <div class="center" style="top: 1440px"><div class="badge">NOCARB-T · FuXion</div></div>
        <div class="emoji" id="s5-emoji" style="top: 1260px; left: 760px; right: auto; font-size: 150px">☕</div>
      </section>

      <!-- 6: CTA – Gratis-Ratgeber, Codewort wird im Takt getippt -->
      <section class="slide" id="s6">
        <div class="blob" style="left: -420px; top: -380px"></div>
        <div class="ring" style="right: -180px; top: 1220px"></div>
        <div class="center" style="top: 220px"><div class="gift" data-t="s6_gift"></div></div>
        <h1 class="hl" style="top: 330px">
          <span data-t="s6_l1"></span>
          <span data-t="s6_l2"></span>
          <span data-t="s6_l3"></span>
          <span data-t="s6_l4"></span>
        </h1>
        <p class="hl" id="s6-sub" style="top: 760px; font-size: 52px; text-transform: none; font-weight: 800">
          <span data-t="s6_sub"></span>
        </p>
        <p class="hl" id="s6-cta" style="top: 845px; font-size: 64px">
          <span data-t="s6_cta"></span>
        </p>

        <!-- nachgebautes Kommentarfeld -->
        <div class="cfield" style="top: 990px">
          <i class="avatar"></i>
          <div class="ctext"><i class="caret"></i></div>
          <b class="cpost" data-t="s6_post"></b>
        </div>

        <!-- abgeschickter Kommentar -->
        <div class="posted" style="top: 1200px">
          <i class="avatar small"></i>
          <div class="pbody">
            <span class="puser" data-t="s6_user"></span>
            <span class="ptext"></span>
          </div>
          <i class="emo pheart">❤️</i>
          <i class="emo floater">❤️</i><i class="emo floater">❤️</i><i class="emo floater">❤️</i><i class="emo floater">❤️</i><i class="emo floater">❤️</i>
        </div>
      </section>
    </div>

    <div id="dots"></div>
  </div>

  <script src="texts.js"></script>
  <script src="assets/frames.js"></script>
  <script src="vendor/motion.js"></script>
  <script src="reel.js"></script>
</body>
</html>
