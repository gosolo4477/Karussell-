<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>NoCarb-T Reel</title>
  <style>
    :root {
      --orange: #ff6a00;
      --blue: #0047ff;
      --navy: #0a1a4f;
      --white: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; }

    html, body { background: #111; }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      font-family: "Inter Display", "Inter", system-ui, sans-serif;
    }

    body.render { display: block; min-height: 0; }

    #stage {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: var(--orange);
    }

    #track {
      position: absolute;
      inset: 0;
    }

    .slide {
      position: absolute;
      top: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      color: var(--white);
    }

    .slide.orange { background: var(--orange); }
    .slide.blue { background: var(--blue); }

    .blob {
      position: absolute;
      width: 1300px;
      height: 1300px;
      border-radius: 50%;
    }

    .orange .blob { background: #ff8a2e; }
    .blue .blob { background: #2a63ff; }

    .ring {
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      border: 26px solid var(--white);
      opacity: 0.15;
    }

    .hl {
      position: absolute;
      left: 80px;
      right: 80px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      line-height: 0.95;
      text-align: center;
    }

    .hl > span { display: block; }

    .mark {
      display: inline-block;
      padding: 0 22px 8px;
      border-radius: 18px;
    }

    .orange .mark { background: var(--blue); }
    .blue .mark { background: var(--orange); }

    .card {
      position: absolute;
      left: 50%;
      border: 14px solid var(--white);
      border-radius: 48px;
      overflow: hidden;
      box-shadow: 0 40px 80px rgb(0 0 0 / 0.35);
    }

    .card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .chips {
      position: absolute;
      left: 60px;
      right: 60px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 22px;
    }

    .spot {
      position: absolute;
      width: 0;
      height: 0;
    }

    .spot b,
    .spot .ripple {
      position: absolute;
      left: -32px;
      top: -32px;
      width: 64px;
      height: 64px;
      border-radius: 50%;
    }

    .spot b {
      display: grid;
      place-items: center;
      background: var(--blue);
      border: 6px solid var(--white);
      color: var(--white);
      font-size: 32px;
      font-weight: 900;
      box-shadow: 0 6px 16px rgb(0 0 0 / 0.35);
    }

    .spot .ripple {
      border: 6px solid var(--blue);
      opacity: 0;
    }

    .num {
      display: inline-grid;
      place-items: center;
      width: 50px;
      height: 50px;
      margin-right: 12px;
      border-radius: 50%;
      background: var(--blue);
      color: var(--white);
      font-size: 30px;
      vertical-align: 5px;
    }

    .arrow {
      position: absolute;
      left: 495px;
      width: 90px;
      height: 110px;
    }

    .chip {
      padding: 14px 30px 18px;
      border-radius: 999px;
      background: var(--white);
      color: var(--navy);
      font-size: 50px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .emoji {
      position: absolute;
      left: 0;
      right: 0;
      text-align: center;
      font-family: "Noto Color Emoji", sans-serif;
    }

    .check {
      display: inline-grid;
      place-items: center;
      width: 110px;
      height: 110px;
      margin-right: 24px;
      border-radius: 50%;
      background: var(--white);
      color: var(--blue);
      font-size: 84px;
      vertical-align: middle;
    }

    .center {
      position: absolute;
      left: 0;
      right: 0;
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 18px 40px 22px;
      border-radius: 999px;
      background: var(--blue);
      font-size: 54px;
      font-weight: 800;
      white-space: nowrap;
    }

    .cta-box {
      display: inline-block;
      padding: 20px 60px 34px;
      border-radius: 40px;
      background: var(--orange);
      font-size: 168px;
      font-weight: 900;
      letter-spacing: -0.03em;
      white-space: nowrap;
      box-shadow: 0 30px 0 var(--navy);
    }

    .chips.small { left: 30px; right: 30px; gap: 16px; }
    .chips.small .chip { font-size: 40px; padding: 12px 26px 15px; }
    .chips.small .num { width: 44px; height: 44px; font-size: 26px; vertical-align: 4px; }

    .panel {
      position: absolute;
      left: 60px;
      right: 60px;
      padding: 40px 44px 44px;
      border-radius: 44px;
      background: var(--white);
      color: var(--navy);
      box-shadow: 0 24px 0 var(--navy);
    }

    .p-head {
      margin-bottom: 22px;
      font-size: 58px;
      font-weight: 900;
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: -0.01em;
    }

    .p-row {
      display: flex;
      align-items: center;
      gap: 22px;
      margin-top: 14px;
      font-size: 46px;
      font-weight: 800;
      line-height: 1.15;
    }

    .p-arrow { flex: none; width: 66px; height: 44px; }
    .orange .p-arrow path { fill: var(--blue); }
    .blue .p-arrow path { fill: var(--orange); }

    .blue .badge { background: var(--orange); }
    .orange .cta-box { background: var(--blue); }

    .groups {
      position: absolute;
      left: 50px;
      right: 50px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .group {
      padding: 26px 34px 30px;
      border-radius: 34px;
      background: var(--white);
      color: var(--navy);
      box-shadow: 0 14px 0 var(--navy);
    }

    .g-head {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 50px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .g-head .num { margin-right: 0; }
    .g-head .num:last-of-type { margin-right: 10px; }

    .g-names {
      margin-top: 6px;
      font-size: 33px;
      font-weight: 700;
      opacity: 0.75;
    }

    .group .p-row { margin-top: 12px; font-size: 41px; gap: 16px; }
    .group .p-arrow { width: 54px; height: 36px; }
    .spot b, .spot .ripple { left: -27px; top: -27px; width: 54px; height: 54px; }
    .spot b { font-size: 28px; border-width: 5px; }

    .spark {
      position: absolute;
      width: 26px;
      height: 26px;
      margin: -13px 0 0 -13px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff 0 25%, #ffd84a 45%, rgb(255 216 74 / 0) 70%);
      opacity: 0;
    }

    .chips.small .chip { font-size: 44px; }

    .emo { font-family: "Noto Color Emoji", sans-serif; font-style: normal; display: inline-block; }

    .cfield,
    .posted {
      position: absolute;
      left: 60px;
      right: 60px;
      display: flex;
      align-items: center;
      gap: 26px;
      background: var(--white);
      color: var(--navy);
      box-shadow: 0 18px 0 var(--navy);
    }

    .cfield { z-index: 2; height: 150px; padding: 0 40px 0 30px; border-radius: 75px; }
    .posted { padding: 28px 40px 28px 30px; border-radius: 44px; }

    .avatar {
      flex: none;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--orange), var(--blue));
      border: 6px solid #fff;
      box-shadow: 0 0 0 4px var(--orange);
    }

    .avatar.small { width: 80px; height: 80px; }

    .ctext {
      position: relative;
      flex: 1;
      font-size: 76px;
      font-weight: 900;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .ltr { display: inline-block; }

    .caret {
      position: absolute;
      left: 0;
      top: 8px;
      width: 7px;
      height: 78px;
      border-radius: 4px;
      background: var(--blue);
    }

    .cpost { font-size: 46px; font-weight: 800; color: var(--blue); }

    .pbody { flex: 1; display: flex; flex-direction: column; }
    .puser { font-size: 34px; font-weight: 700; opacity: 0.6; }
    .ptext { font-size: 70px; font-weight: 900; line-height: 1.1; }
    .pheart { font-size: 84px; }

    .floater {
      position: absolute;
      right: 52px;
      top: 40px;
      font-size: 60px;
      opacity: 0;
    }

    .gift {
      display: inline-block;
      padding: 14px 40px 18px;
      border-radius: 999px;
      background: var(--navy);
      color: var(--white);
      font-size: 46px;
      font-weight: 900;
      letter-spacing: 0.04em;
    }

    .photo {
      position: absolute;
      border: 12px solid var(--white);
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 30px 60px rgb(0 0 0 / 0.35);
    }

    .photo.arch { border-radius: 200px 200px 32px 32px; }
    .photo img { display: block; width: 100%; height: 100%; object-fit: cover; }

    .lang-de #s4 .hl { font-size: 76px !important; }
    .lang-de #s1 .hl { font-size: 110px !important; }
    .lang-de #s6-sub { font-size: 44px !important; }

    .wa { display: inline-block; flex: none; }
    .wave-arrow { display: block; width: 64px; height: 36px; overflow: hidden; }
    .wa.big .wave-arrow { width: 92px; height: 52px; }
    .orange .wave-arrow { color: var(--blue); }
    .blue .wave-arrow { color: var(--orange); }
    .g-head .wa { margin-right: 6px; }
    .group .p-row { align-items: flex-start; }
    .group .p-row .wa { margin-top: 6px; }

    #s6 h1.hl { font-size: 88px; line-height: 1.08; }

    #dots {
      position: absolute;
      left: 0;
      right: 0;
      top: 1560px;
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .dot {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: var(--white);
      opacity: 0.45;
    }

    /* ---------- Theme "dark": dunkler Premium-Look mit Orange/Gold ---------- */
    .swipe { display: none; }
    .theme-dark {
      --orange: #f2621c;
      --gold: #d9a441;
      --ink: #121010;
    }
    .theme-dark #stage {
      background:
        radial-gradient(1100px 900px at 85% 108%, rgb(242 98 28 / 0.55), transparent 70%),
        radial-gradient(900px 700px at 0% 100%, rgb(160 70 20 / 0.45), transparent 70%),
        radial-gradient(1200px 700px at 50% -10%, rgb(90 70 40 / 0.55), transparent 70%),
        linear-gradient(180deg, #2a2420 0%, #141111 45%, #0d0b0b 100%);
    }
    .theme-dark .slide.orange, .theme-dark .slide.blue { background: transparent; }
    .theme-dark .blob { background: radial-gradient(circle, rgb(242 98 28 / 0.22), transparent 62%) !important; }
    .theme-dark .ring { border: 6px solid var(--gold); opacity: 0.14; }
    .theme-dark .mark { background: var(--orange) !important; border-radius: 10px; padding: 0 20px 6px; }
    .theme-dark .card {
      border: 6px solid var(--gold);
      border-radius: 40px;
      box-shadow: 0 0 0 2px rgb(0 0 0 / 0.4), 0 40px 90px rgb(0 0 0 / 0.6), 0 0 70px rgb(217 164 65 / 0.18);
    }
    .theme-dark .group {
      background: rgb(255 255 255 / 0.06);
      color: #fff;
      border: 3px solid rgb(217 164 65 / 0.35);
      box-shadow: 0 20px 50px rgb(0 0 0 / 0.45);
    }
    .theme-dark .g-head { color: var(--gold); font-size: 46px; letter-spacing: 0.02em; }
    .theme-dark .g-names { color: #fff; opacity: 0.55; }
    .theme-dark .group .p-row { font-weight: 700; }
    .theme-dark .wave-arrow { color: var(--orange) !important; }
    .theme-dark .chip { background: rgb(255 255 255 / 0.06); color: #fff; border: 3px solid rgb(217 164 65 / 0.5); }
    .theme-dark .check { background: transparent; color: var(--orange); border: 8px solid var(--orange); }
    .theme-dark .badge { background: var(--orange) !important; }
    .theme-dark .gift { background: var(--gold); color: var(--ink); }
    .theme-dark #s6-cta { color: var(--gold); }
    .theme-dark .cfield, .theme-dark .posted { background: #f5f1ea; box-shadow: 0 24px 60px rgb(0 0 0 / 0.55), 0 0 0 4px rgb(217 164 65 / 0.35); }
    .theme-dark .posted { color: var(--ink); }
    .theme-dark .cpost { color: var(--orange); }
    .theme-dark .caret { background: var(--orange); }
    .theme-dark .avatar { background: linear-gradient(135deg, var(--orange), var(--gold)); box-shadow: 0 0 0 4px var(--gold); }
    .theme-dark .dot { background: var(--gold); }
    .theme-dark .swipe {
      display: block;
      position: absolute; left: 0; right: 0; top: 1500px;
      text-align: center; color: var(--gold);
      font-size: 36px; font-weight: 800; letter-spacing: 0.24em; text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="track">
      <!-- 1: Hook -->
      <section class="slide" id="s1">
        <div class="blob" style="left: -420px; top: 900px"></div>
        <div class="ring" style="right: -160px; top: 120px"></div>
        <h1 class="hl" style="top: 230px; font-size: 128px">
          <span data-t="s1_l1"></span>
          <span data-t="s1_l2"></span>
          <span data-t="s1_l3"></span>
        </h1>
        <div class="card" style="top: 760px; width: 560px; height: 720px; margin-left: -280px">
          <img id="s1-video" src="assets/pizza-frames/f_0001.jpg" alt="" style="object-position: 50% 30%" />
        </div>
        <p class="swipe"><span data-t="s1_swipe"></span></p>
        <div class="emoji" id="s1-emoji" style="top: 1300px; left: 640px; right: auto; font-size: 170px">🍕</div>
      </section>

      <!-- 2: Frage -->
      <section class="slide" id="s2">
        <div class="blob" style="right: -500px; top: -300px"></div>
        <div class="ring" style="left: -180px; top: 1180px"></div>
        <h1 class="hl" style="top: 420px; font-size: 250px; line-height: 0.9">

        </h1>
        <div class="emoji" id="s2-emoji" style="top: 1000px; font-size: 300px">😬</div>
      </section>

      <!-- 3: Alle Inhaltsstoffe auf einer Folie -->
      <section class="slide" id="s3">
        <div class="blob" style="left: -500px; top: -420px"></div>
        <div class="ring" style="right: -200px; top: 1250px"></div>
        <h1 class="hl" style="top: 150px; font-size: 104px">
          <span data-t="s3_title"></span>
        </h1>
        <div class="card" style="top: 330px; width: 840px; height: 400px; margin-left: -420px">
          <img id="s3-video" src="assets/zutaten-frames/f_0001.jpg" alt="" style="object-position: 50% 45%" />

        <div class="groups" style="top: 790px">

            <p class="p-row"><i class="wa"></i><span data-t="g1_row"></span></p>
          </div>
          <div class="group">
            <p class="g-head"><i class="wa big"></i><span data-t="g2_head"></span></p>
            <p class="p-row"><i class="wa"></i><span data-t="g2_row"></span></p>
          </div>
          <div class="group">
            <p class="g-head"><i class="wa big"></i><span data-t="g3_head"></span></p>
            <p class="p-row"><i class="wa"></i><span data-t="g3_row"></span></p>
          </div>
        </div>
      </section>

      <!-- 3w: Wirkung (Bild) -->
      <section class="slide" id="s3w">
        <div class="blob" style="right: -480px; top: -380px"></div>
        <div class="ring" style="left: -190px; top: 1240px"></div>
        <h1 class="hl" style="top: 190px; font-size: 120px">
          <span data-t="s3w_l1"></span>
          <span data-t="s3w_l2"></span>
        </h1>
        <div class="card" style="top: 500px; width: 900px; height: 470px; margin-left: -450px">
          <img src="assets/wirkung.jpg" alt="" style="object-position: 60% 50%" />
          <i class="spark" style="left: 350px; top: 187px"></i><i class="spark" style="left: 316px; top: 294px"></i><i class="spark" style="left: 391px; top: 232px"></i><i class="spark" style="left: 329px; top: 133px"></i><i class="spark" style="left: 307px; top: 115px"></i><i class="spark" style="left: 392px; top: 250px"></i><i class="spark" style="left: 364px; top: 314px"></i><i class="spark" style="left: 485px; top: 125px"></i><i class="spark" style="left: 346px; top: 243px"></i><i class="spark" style="left: 427px; top: 202px"></i><i class="spark" style="left: 360px; top: 309px"></i><i class="spark" style="left: 334px; top: 321px"></i>
        </div>
        <div class="chips small" style="top: 1040px; flex-direction: column; align-items: center; gap: 22px">
          <span class="chip"><span data-t="s3w_c1"></span></span>
          <span class="chip"><span data-t="s3w_c2"></span></span>
          <span class="chip"><span data-t="s3w_c3"></span></span>
        </div>
      </section>

      <!-- 4: Ohne -->
      <section class="slide" id="s4">
        <div class="blob" style="left: -400px; top: 1000px"></div>
        <div class="ring" style="right: -150px; top: 160px"></div>
        <h1 class="hl" style="top: 600px; font-size: 92px; line-height: 1.9; text-align: left; left: 70px; right: 40px">
          <span><span class="check"><svg viewBox="0 0 24 24" width="64" height="64"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span data-t="s4_l1"></span></span>
          <span><span class="check"><svg viewBox="0 0 24 24" width="64" height="64"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span data-t="s4_l2"></span></span>
        </h1>
      </section>

      <!-- 5: Ritual -->
      <section class="slide" id="s5">
        <div class="blob" style="right: -520px; top: 980px"></div>
        <div class="ring" style="left: -170px; top: 140px"></div>
        <h1 class="hl" style="top: 180px; font-size: 118px">
          <span data-t="s5_l1"></span>
          <span data-t="s5_l2"></span>
          <span data-t="s5_l3"></span>
        </h1>
        <div class="card" style="top: 590px; width: 600px; height: 800px; margin-left: -300px">

        <div class="emoji" id="s5-emoji" style="top: 1260px; left: 760px; right: auto; font-size: 150px">☕</div>

      <!-- 6: CTA – Gratis-Ratgeber, Codewort wird im Takt getippt -->

        <div class="blob" style="left: -420px; top: -380px"></div>
        <div class="ring" style="right: -180px; top: 1220px"></div>

        <h1 class="hl" style="top: 330px">

          <span data-t="s6_l4"></span>

        <p class="hl" id="s6-cta" style="top: 845px; font-size: 64px">

        <!-- nachgebautes Kommentarfeld -->
        <div class="cfield" style="top: 990px">
          <i class="avatar"></i>
          <div class="ctext"><i class="caret"></i></div>
          <b class="cpost" data-t="s6_post"></b>
        </div>

        <!-- abgeschickter Kommentar -->
        <div class="posted" style="top: 1200px">
          <i class="avatar small"></i>
          <div class="pbody">
            <span class="puser" data-t="s6_user"></span>
            <span class="ptext"></span>
          </div>
          <i class="emo pheart">❤️</i>
          <i class="emo floater">❤️</i><i class="emo floater">❤️</i><i class="emo floater">❤️</i><i class="emo floater">❤️</i><i class="emo floater">❤️</i>
        </div>
      </section>
    </div>

    <div id="dots"></div>
  </div>

  <script src="texts.js"></script>
  <script src="assets/frames.js"></script>
  <script src="vendor/motion.js"></script>
  <script src="reel.js"></script>
</body>
</html>
